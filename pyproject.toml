[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "intensity-oscillation-tracker"
version = "0.2.2"
description = "Local fluorescence time-series analysis with fixed circular regions."
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.1,<3",
  "scipy>=1.14,<2",
  "scikit-image>=0.26,<0.27",
  "tifffile>=2025.1.10",
  "imagecodecs>=2025.3.30",
  "pillow>=11,<13",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "cellpose==4.2.1.1",
  "torch==2.11.0",
  "torchvision==0.26.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]
desktop = ["PySide6==6.12.0; sys_platform == 'win32'"]
build = ["pyinstaller==6.22.3", "pyinstaller-hooks-contrib==2026.9"]

[project.scripts]
intensity-tracker = "tracker.__main__:main"
intensity-desktop = "tracker.desktop:main"

[tool.setuptools.packages.find]
include = ["tracker*"]

[tool.setuptools.package-data]
tracker = ["static/*", "packaging/*.spec"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]
